# OpenShell sandbox policy for the Pactovio desk agent. Default is deny: only the endpoints below are reachable,
# and only by the Python interpreter that runs Hermes and the bridge (and curl for diagnostics).
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /etc, /opt, /proc, /var/log]
  read_write: [/sandbox, /tmp]
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  nebius_token_factory:
    name: Nebius Token Factory (inference)
    endpoints:
      - host: api.tokenfactory.nebius.com
        port: 443
        protocol: rest
        access: read-write
        enforcement: enforce
        credential_binding: { provider: pactovio-nebius }
    binaries: &bins
      - { path: /opt/hermes/bin/python }
      - { path: /opt/hermes/bin/python3 }
      - { path: /opt/hermes/bin/python3.12 }
      - { path: /usr/local/bin/python3.12 }
      - { path: /usr/local/bin/python3 }
      - { path: /usr/bin/curl }
  pactovio_hosted:
    name: Pactovio hosted (MCP and event stream)
    endpoints:
      - host: pactovio.pages.dev
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
        credential_binding: { provider: pactovio-api }
    binaries: *bins
  pactovio_local_dev:
    name: Pactovio local dev server (testing only)
    endpoints:
      - host: host.openshell.internal
        port: 8798
        protocol: rest
        access: full
        enforcement: enforce
        credential_binding: { provider: pactovio-api }
    binaries: *bins
  slack:
    name: Slack (gateway; Socket Mode needs the two wss hosts)
    endpoints:
      - { host: slack.com, port: 443, protocol: rest, access: full, enforcement: enforce }
      - { host: api.slack.com, port: 443, protocol: rest, access: full, enforcement: enforce }
      - { host: wss-primary.slack.com, port: 443, protocol: rest, access: full, enforcement: enforce }
      - { host: wss-backup.slack.com, port: 443, protocol: rest, access: full, enforcement: enforce }
    binaries: *bins
