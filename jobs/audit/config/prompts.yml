prompts:
  # [NeMo task prompt for self check facts] wording is ours, mechanism is NeMo's.
  - task: self_check_facts
    max_tokens: 200
    content: |-
      You are given a task to identify if the hypothesis is grounded and entailed to the evidence.
      You will only use the contents of the evidence and not rely on external knowledge.
      Every concrete figure, certificate, client name and commitment in the hypothesis must appear in the evidence.
      Answer with yes or no only. "yes" means entailed by the evidence; "no" means anything is unsupported or contradicted.

      evidence: {{ evidence }}
      hypothesis: {{ response }}
      entails (yes/no):
